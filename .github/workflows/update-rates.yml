name: 충전요금 자동 갱신

# 매달 1일 오전 9시(한국 시간)에 차지인포 요금을 다시 받아, 바뀐 게 있으면 커밋한다.
# 커밋되면 GitHub Pages가 자동으로 다시 배포된다. Actions 탭에서 직접 실행할 수도 있다.
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 차지인포 요금 수집
        run: node scripts/update-chargeinfo.mjs
      - name: 바뀐 단가 커밋
        run: |
          if git diff --quiet; then
            echo "단가 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chargeinfo.js
          git commit -m "차지인포 충전요금 자동 갱신"
          git push
